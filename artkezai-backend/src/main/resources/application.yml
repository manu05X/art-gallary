spring:
  application:
    name: artkezai
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/artkezai}
    username: ${DB_USER:artkezai_user}
    password: ${DB_PASS:artkezai_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false

# ── JWT ──────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:artkezai-local-dev-secret-key-must-be-at-least-256-bits-long!!}
  expiration-ms: 86400000 # 24 hours
  refresh-expiration-ms: 604800000 # 7 days

# ── MinIO ────────────────────────────────────────────────
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin123}
  bucket: ${MINIO_BUCKET:artkezai-paintings}
  public-base-url: ${MINIO_PUBLIC_URL:http://localhost:9000/artkezai-paintings}

# ── Stripe ───────────────────────────────────────────────
stripe:
  # No insecure fallback (Phase 2.16 — same class of issue Phase 2.15a fixed
  # for webhook-secret): a placeholder default here would be a real, literal
  # secret key checked into source. Phase 2.16 wires this into Stripe.apiKey
  # for genuine PaymentIntent calls, so a missing value must not silently
  # fall back to a known-fake key — Spring fails to start instead.
  secret-key: ${STRIPE_SECRET_KEY}
  # publishable-key is, by Stripe's own design, meant to be public (shipped
  # to the browser) — a placeholder default here is not the same class of
  # risk as secret-key/webhook-secret, so it's intentionally left as-is.
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:pk_test_REPLACE_WITH_YOUR_PUBLISHABLE_KEY}
  # No insecure fallback here (unlike publishable-key above): a placeholder
  # default would be a real, literal secret checked into source that could
  # verify forged webhook signatures if STRIPE_WEBHOOK_SECRET is ever left
  # unset in a running environment. With no default, Spring fails to start
  # the application at all when this property can't be resolved — fail
  # closed, not fail open.
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}
  currency: usd

# ── App ──────────────────────────────────────────────────
app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  mail-from: ${MAIL_FROM:noreply@artkezai.com}
  mail-from-name: Artkezai Gallery

  # Phase 2.21: rate limiting for POST /api/auth/login and
  # POST /api/auth/register only. Each bucket refills "greedily" — tokens
  # trickle back continuously over the window rather than all at once, so a
  # legitimate user who mistypes a password a couple of times is never fully
  # locked out for the whole window.
  #
  # login: keyed per (client address + normalized email). 5 attempts, fully
  # refilling over 60s (~1 every 12s) — generous enough for a genuine user
  # retyping a forgotten password a few times, tight enough to make online
  # credential brute force against one account impractical.
  #
  # register: keyed per client address alone. 3 attempts per 5 minutes — a
  # real person registers once; this mainly exists to blunt automated
  # signup/spam scripts hammering the endpoint, while still tolerating a
  # shared-IP household/office registering a couple of accounts back to back.
  rate-limit:
    login:
      capacity: ${AUTH_LOGIN_RATE_CAPACITY:5}
      refill-tokens: ${AUTH_LOGIN_RATE_REFILL_TOKENS:5}
      refill-period-seconds: ${AUTH_LOGIN_RATE_REFILL_SECONDS:60}
    register:
      capacity: ${AUTH_REGISTER_RATE_CAPACITY:3}
      refill-tokens: ${AUTH_REGISTER_RATE_REFILL_TOKENS:3}
      refill-period-seconds: ${AUTH_REGISTER_RATE_REFILL_SECONDS:300}

# ── Actuator (health check for Render) ───────────────────
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# ── Logging ──────────────────────────────────────────────
logging:
  level:
    com.artkezai: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
  pattern:
    console: "%d{HH:mm:ss} [%highlight(%-5level)] %cyan(%logger{30}) - %msg%n"

---
# ══════════════════════════════════════════════════════════
# Production profile  (SPRING_PROFILES_ACTIVE=prod)
# ══════════════════════════════════════════════════════════
spring:
  config:
    activate:
      on-profile: prod
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  thymeleaf:
    cache: true

# No fallback in production: the local-dev secret above is public, and a
# token signed with it would be accepted. Spring fails to start instead.
jwt:
  secret: ${JWT_SECRET}

app:
  # Used once by SeedAccountGuard to replace the seed admin's published
  # default password. Leave unset to deactivate the seed admin instead.
  admin-initial-password: ${ADMIN_INITIAL_PASSWORD:}
  # Same for the three V8 demo artists; leave unset to deactivate them.
  demo-artist-password: ${DEMO_ARTIST_PASSWORD:}

logging:
  level:
    com.artkezai: INFO
    org.springframework.security: WARN
    org.flywaydb: WARN

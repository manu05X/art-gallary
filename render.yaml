services:
  # ── Spring Boot Backend ────────────────────────────────
  - type: web
    name: artkezai-backend
    runtime: docker
    dockerfilePath: ./artkezai-backend/Dockerfile
    dockerContext: ./artkezai-backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      # Database is hosted on Neon (neon.tech), not Render. Set these in the
      # Render dashboard from Neon → Connection details (direct, not pooled):
      #   DB_URL  jdbc:postgresql://<neon-host>/<dbname>?sslmode=require
      #   DB_USER / DB_PASS  Neon role and password
      # The previous Render PostgreSQL setup is kept in
      # render.render-postgres.reference.yaml.
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false          # set manually after Vercel deploy
      - key: ALLOWED_ORIGINS
        sync: false          # set manually after Vercel deploy
      # Render free web services block outbound ports 25, 465 and 587, so
      # Gmail SMTP cannot work here. Use a provider that accepts port 2525
      # (e.g. Brevo: smtp-relay.brevo.com). MAIL_FROM must be a sender
      # address verified with that provider.
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MINIO_ENDPOINT
        sync: false          # S3-compatible endpoint (MinIO, R2, S3); required for image upload
      - key: MINIO_ACCESS_KEY
        sync: false
      - key: MINIO_SECRET_KEY
        sync: false
      - key: MINIO_BUCKET
        sync: false
      - key: MINIO_PUBLIC_URL
        sync: false          # public base URL that serves objects from MINIO_BUCKET
      - key: ADMIN_INITIAL_PASSWORD
        sync: false          # 12+ chars; replaces the seed admin's published password on first start
      - key: DEMO_ARTIST_PASSWORD
        sync: false          # 12+ chars; keeps the demo artist logins working with a private password
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SPRING_PROFILES_ACTIVE
        value: prod

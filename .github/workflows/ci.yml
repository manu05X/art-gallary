name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artkezai-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test and package
        run: mvn -B clean package

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artkezai-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: artkezai-frontend/package-lock.json
      - run: npm ci
      - name: Type-check, lint and build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://example.invalid/api
